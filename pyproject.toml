[project]
name = "flip"
version = "0.1.0"
description = "CB1 flip-feasibility analyser"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pyyaml>=6",
  "pillow>=10",
  "shapely>=2",
  "pyproj>=3.6",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flip = "flip.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flip*"]

[tool.setuptools.package-data]
flip = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
